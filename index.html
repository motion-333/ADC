<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aux Dés Calés Slideshow</title>
  <link rel="preload" as="image" href="/static/header_img/header1.jpg">
  <link rel="preload" as="image" href="/static/header_img/header2.jpg">
  <link rel="preload" as="image" href="/static/header_img/header3.jpg">
  <link rel="preload" as="image" href="/static/header_img/header4.jpg">
  <link rel="preload" as="image" href="/static/header_img/header5.jpg">
  <link rel="preload" as="image" href="/static/header_img/header6.jpg">
  <link rel="preload" as="image" href="/static/header_img/header7.jpg">
  <link rel="preload" as="image" href="/static/header_img/header8.jpg">
  <link rel="preload" as="image" href="/static/header_img/header9.jpg">
  <link rel="preload" as="image" href="/static/header_img/header10.jpg">
  <link rel="preload" as="image" href="/static/header_img/header11.jpg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Futura:wght@700&display=swap');
    :root {
      --header-height: 10vh;
      --scroll-duration: 2000ms;
      --slide-duration: 1000ms;
      --slide-interval: 2000ms;
      --border-color: #b20000;
      --text-color: #f1ede2;
      --slide-scale: 110%;
      --float-distance: 3%;
      --padding1: 1rem;
      --spacing1: 1.5rem;
      --spacing2: 2rem;
      --topbar-color-light: #163359;
      --topbar-color-dark: #f1ede2;
      --topbar-text: var(--topbar-color-dark);
      --zig-size: 20px;
      --zig-step: 2%;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Futura', sans-serif; }

    /* Topbar */
    .topbar {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 40px);
      left: 0;
      width: 100vw;
      height: var(--header-height);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 var(--padding1);
      z-index: 1000;
    }
    .topbar::before {
      content: '';
      position: absolute; top: -40px; left: 0;
      width: 100%; height: calc(100% + 80px);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0) 100%);
      z-index: 0;
    }
    .topbar > * { position: relative; z-index: 1; }
    .left-group,
    .right-group {
      display: flex;
      align-items: center;
    }
    .left-group {
      padding-right: var(--spacing1);
      gap: var(--spacing1);
      justify-content: flex-start;
    }
    .right-group {
      padding-left: var(--spacing2);
      gap: var(--spacing2);
      justify-content: flex-end;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      justify-self: center;
    }
    .topbar a {
      color: var(--topbar-text);
      text-transform: uppercase;
      font-weight: bold;
      font-size: 0.9rem;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.5s;
    }
    .logo {
      height: 60%;
      max-height: var(--header-height);
      cursor: pointer;
    }

    /* Splitscreen */
    .splitscreen { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
    .split { flex: 1; position: relative; overflow: hidden; }
    .split + .split { border-left: 5px solid var(--border-color); }

    /* Slides */
    .slide {
      position: absolute; top: 50%; left: 50%;
      width: var(--slide-scale); height: var(--slide-scale);
      background-size: cover; background-position: center;
      transform: translate(-50%, -50%);
      transition: transform var(--slide-duration) ease-in-out;
    }

    /* Blocks */
    .red-rect {
      background: var(--border-color);
      color: var(--text-color);
      width: 100vw;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1rem;
      clip-path: polygon(0 0,100% 0,100% calc(100% - var(--zig-size)),98% 100%,96% calc(100% - var(--zig-size)),94% 100%,92% calc(100% - var(--zig-size)),90% 100%,88% calc(100% - var(--zig-size)),86% 100%,84% calc(100% - var(--zig-size)),82% 100%,80% calc(100% - var(--zig-size)),78% 100%,76% calc(100% - var(--zig-size)),74% 100%,72% calc(100% - var(--zig-size)),70% 100%,68% calc(100% - var(--zig-size)),66% 100%,64% calc(100% - var(--zig-size)),62% 100%,60% calc(100% - var(--zig-size)),58% 100%,56% calc(100% - var(--zig-size)),54% 100%,52% calc(100% - var(--zig-size)),50% 100%,48% calc(100% - var(--zig-size)),46% 100%,44% calc(100% - var(--zig-size)),42% 100%,40% calc(100% - var(--zig-size)),38% 100%,36% calc(100% - var(--zig-size)),34% 100%,32% calc(100% - var(--zig-size)),30% 100%,28% calc(100% - var(--zig-size)),26% 100%,24% calc(100% - var(--zig-size)),22% 100%,20% calc(100% - var(--zig-size)),18% 100%,16% calc(100% - var(--zig-size)),14% 100%,12% calc(100% - var(--zig-size)),10% 100%,8% calc(100% - var(--zig-size)),6% 100%,4% calc(100% - var(--zig-size)),2% 100%,0% calc(100% - var(--zig-size)),0 0);
    }
    .red-box {
      background: var(--border-color);
      width: 100vw;
      height: 200px;
    }
    .main-yellow {
      background: var(--text-color);
      width: 100vw;
      height: 100vh;
      clip-path: polygon(0 0,2% var(--zig-size),4% 0,6% var(--zig-size),8% 0,10% var(--zig-size),12% 0,14% var(--zig-size),16% 0,18% var(--zig-size),20% 0,22% var(--zig-size),24% 0,26% var(--zig-size),28% 0,30% var(--zig-size),32% 0,34% var(--zig-size),36% 0,38% var(--zig-size),40% 0,42% var(--zig-size),44% 0,46% var(--zig-size),48% 0,50% var(--zig-size),52% 0,54% var(--zig-size),56% 0,58% var(--zig-size),60% 0,62% var(--zig-size),64% 0,66% var(--zig-size),68% 0,70% var(--zig-size),72% 0,74% var(--zig-size),76% 0,78% var(--zig-size),80% 0,82% var(--zig-size),84% 0,86% var(--zig-size),88% 0,90% var(--zig-size),92% 0,94% var(--zig-size),96% 0,98% var(--zig-size),100% 0,100% 100%,0 100%);
      margin-top: calc(-1 * var(--zig-size));
    }
    .main-purple { background: purple; width: 100vw; height: 100vh; }
    .pink-block { background: pink; width: 100vw; height: 33vh; }
    .footer {
      background: var(--border-color);
      width: 100vw;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--padding1);
      color: var(--text-color);
      font-size: 0.8rem;
    }
    .footer-right {
      display: flex;
      align-items: center;
      gap: var(--spacing1);
    }
    #back-top {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    /* Float animations */
    @keyframes float-left { from{transform:translate(-50%,-50%);} to{transform:translate(calc(-50% + var(--float-distance)),-50%);} }
    @keyframes float-right{ from{transform:translate(-50%,-50%);} to{transform:translate(calc(-50% - var(--float-distance)),-50%);} }
    @keyframes float-up   { from{transform:translate(-50%,-50%);} to{transform:translate(-50%,calc(-50% + var(--float-distance)));} }
    @keyframes float-down { from{transform:translate(-50%,-50%);} to{transform:translate(-50%,calc(-50% - var(--float-distance)));} }
    .float-left { animation: float-left var(--slide-interval) linear forwards; }
    .float-right{ animation: float-right var(--slide-interval) linear forwards; }
    .float-up   { animation: float-up var(--slide-interval) linear forwards; }
    .float-down { animation: float-down var(--slide-interval) linear forwards; }

    .resto-frame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="left-group">
      <a href="https://www.auxdescales17.fr">Aux Dés Calés 17</a>
      <a href="https://www.auxdescales18.fr">Aux Dés Calés 18</a>
      <a href="https://www.audetour18.fr">Au Détour</a>
    </nav>
    <div class="logo-container">
      <img src="/static/logo.png" alt="Logo" class="logo" id="logo-btn">
    </div>
    <nav class="right-group">
      <a href="#yellow">Nos Restos</a>
      <a href="#purple">Nous</a>
      <a href="#pink">Privatiser?</a>
    </nav>
  </header>

  <div class="splitscreen">
    <div class="split" id="split-left"></div>
    <div class="split" id="split-right"></div>
  </div>

  <div class="red-rect">
    Il faudra remplir ici avec un texte qui décrit l'unité des trois restaurants à la fois au niveau de sa carte mais aussi de son ambiance.
  </div>
  <div class="main-yellow" id="yellow">
    <iframe src="resto.html" class="resto-frame"></iframe>
  </div>
  <div class="red-box"></div>
  <div class="main-purple" id="purple"></div>
  <div class="pink-block" id="pink"></div>
  <div class="footer">
    <span>©2025 Aux Dés Calés</span>
    <div class="footer-right">
      <button id="back-top">Haut de page</button>
      <span>Dev. by <a href="https://motion333.com" target="_blank">Motion</a></span>
    </div>
  </div>

  <script>
    // Smooth scroll
    document.addEventListener('DOMContentLoaded', () => {
      const defaultDuration = 2000;
      function ease(t) { return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
      function scrollToY(targetY,duration=defaultDuration) {
        const startY=window.pageYOffset, diff=targetY-startY; let t0;
        function step(ts){ if(!t0)t0=ts; const t=Math.min((ts-t0)/duration,1);
          window.scrollTo(0,startY+diff*ease(t)); if(t<1)requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
      document.querySelectorAll('.topbar a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{
        e.preventDefault(); const sel=a.getAttribute('href'), el=document.querySelector(sel);
        const y=el?el.getBoundingClientRect().top+window.pageYOffset-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-height')):0;
        scrollToY(y);
      }));
      document.getElementById('logo-btn').addEventListener('click',e=>{e.preventDefault();scrollToY(0);});
      const back=document.getElementById('back-top');
      if(back){back.addEventListener('click',e=>{e.preventDefault();scrollToY(0,3000);});}
    });

    // Slideshow
    document.addEventListener('DOMContentLoaded', () => {
      async function fetchImageList(){
        try{const res=await fetch('/static/header_img/');const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');
          return Array.from(doc.querySelectorAll('a')).map(a=>a.getAttribute('href')).filter(h=>/\.(jpe?g|png)$/i.test(h));
        }catch{return[];}
      }
      function avgBright(img){
        const c=document.createElement('canvas');
        c.width=c.height=1;
        const x=c.getContext('2d');
        x.drawImage(img,0,0,1,1);
        const d=x.getImageData(0,0,1,1).data;
        return (d[0]+d[1]+d[2])/3/255;
      }
      function preload(imgs){
        return Promise.all(imgs.map(s=>new Promise(r=>{
          const i=new Image();
          i.src=`/static/header_img/${s}`;
          i.onload=()=>r({src:s,bright:avgBright(i)});
          i.onerror=()=>r({src:s,bright:0});
        })));
      }
      fetchImageList().then(list=>{if(!list.length)return;preload(list).then(data=>{
        const imgs=data.map(d=>d.src);
        const bright=data.map(d=>d.bright);
        const patterns={left:['up','left','down','right'],right:['right','down','left','up']};
        const floatMap={left:'float-left',right:'float-right',up:'float-up',down:'float-down'};
        const floatDist=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--float-distance'));
        function floatOff(dir){return{left:[floatDist,0],right:[-floatDist,0],up:[0,floatDist],down:[0,-floatDist]}[dir];}
        const state={
          left:{idx:0,step:0,cur:null,el:document.getElementById('split-left')},
          right:{idx:1,step:0,cur:null,el:document.getElementById('split-right')}
        };
        function create(src){const d=document.createElement('div');d.className='slide';d.style.backgroundImage=`url(/static/header_img/${src})`;return d;}
        // offset helpers for pan transitions (full-screen)
        function offs(dir){return{left:[-100,0],right:[100,0],up:[0,-100],down:[0,100]}[dir];}
        const brightState={left:bright[state.left.idx],right:bright[state.right.idx]};
        const topbar=document.querySelector('.topbar');
        function getColorBrightness(col){
          const m=col.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
          return m? (parseInt(m[1])+parseInt(m[2])+parseInt(m[3]))/3/255 : 1;
        }
        function elementBrightness(el){
          let e=el;
          while(e&&e!==document&&getComputedStyle(e).backgroundColor==='rgba(0, 0, 0, 0)'){
            e=e.parentElement;
          }
          if(!e) return 1;
          return getColorBrightness(getComputedStyle(e).backgroundColor);
        }
        function brightnessUnderTopbar(){
          const y=topbar.getBoundingClientRect().bottom+1;
          const x=window.innerWidth/2;
          let el=document.elementFromPoint(x,y);
          if(!el) return 1;
          const split=el.closest('.split');
          if(split) return brightState[split.id==='split-left'?'left':'right'];
          return elementBrightness(el);
        }
        function updateTopbar(){
          const br=brightnessUnderTopbar();
          const styles=getComputedStyle(document.documentElement);
          const light=styles.getPropertyValue('--topbar-color-light');
          const dark=styles.getPropertyValue('--topbar-color-dark');
          const color=br>0.5?light:dark;
          document.documentElement.style.setProperty('--topbar-text',color.trim());
          document.querySelectorAll('.topbar a').forEach(a=>a.style.color=color.trim());
        }
        updateTopbar();
        window.addEventListener('scroll',updateTopbar);
        window.addEventListener('resize',updateTopbar);
        function adv(side){
          const s=state[side], pat=patterns[side];
          const dir=pat[(++s.step-1)%pat.length];
          s.idx=(s.idx+1)%imgs.length;
          brightState[side]=bright[s.idx];
          const old=s.cur;
          const next=create(imgs[s.idx]);
          const [ox,oy]=offs(dir);
          const [fx,fy]=floatOff(dir);
          next.style.transform=`translate(calc(-50% + ${ox+fx}% ),calc(-50% + ${oy+fy}% ))`;
          s.el.append(next);
          requestAnimationFrame(()=>{
            const start=getComputedStyle(old).transform;
            old.classList.remove(...Object.values(floatMap));
            old.style.transform=start;
            void old.offsetWidth;
            old.style.transform=`translate(calc(-50% + ${fx-ox}% ),calc(-50% + ${fy-oy}% ))`;
            next.style.transform='translate(-50%,-50%)';
          });
          old.addEventListener('transitionend',()=>{s.el.removeChild(old);next.classList.add(floatMap[dir]);},{once:true});
          s.cur=next;
          updateTopbar();
        }
        ['left','right'].forEach(side=>{const s=state[side];s.cur=create(imgs[s.idx]);s.el.append(s.cur);s.cur.classList.add(floatMap[patterns[side][0]]);
          setInterval(()=>adv(side),parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slide-interval')));
        });
      });});
    });
  </script>

</body>
</html>
