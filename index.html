<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aux Dés Calés Slideshow</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Futura:wght@700&display=swap');
    :root {
      --header-height: 10vh;
      --scroll-duration: 2000ms;
      --slide-duration: 1000ms;
      --slide-interval: 2000ms;
      --border-color: #b20000;
      --text-color: #f1ede2;
      --slide-scale: 110%;
      --float-distance: 3%;
      --padding1: 1rem;
      --spacing1: 1.5rem;
      --spacing2: 2rem;
      --zig-size: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Futura', sans-serif; }

    /* Topbar */
    .topbar {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 20px);
      left: 0;
      width: 100vw;
      height: var(--header-height);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 var(--padding1);
      z-index: 1000;
    }
    .topbar::before {
      content: '';
      position: absolute; top: -20px; left: 0;
      width: 100%; height: calc(100% + 40px);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
      z-index: 0;
    }
    .topbar > * { position: relative; z-index: 1; }
    .left-group,
    .right-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .left-group {
      padding-right: var(--spacing1);
    }
    .right-group {
      padding-left: var(--spacing1);
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      justify-self: center;
    }
    .topbar a {
      color: var(--text-color);
      text-transform: uppercase;
      font-weight: bold;
      font-size: 0.9rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .logo {
      height: 60%;
      max-height: var(--header-height);
      cursor: pointer;
    }

    /* Splitscreen */
    .splitscreen { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
    .split { flex: 1; position: relative; overflow: hidden; }
    .split + .split { border-left: 5px solid var(--border-color); }

    /* Slides */
    .slide {
      position: absolute; top: 50%; left: 50%;
      width: var(--slide-scale); height: var(--slide-scale);
      background-size: cover; background-position: center;
      transform: translate(-50%, -50%);
      transition: transform var(--slide-duration) ease-in-out;
    }

    /* Blocks */
    .red-rect {
      background: var(--border-color);
      color: var(--text-color);
      width: 100vw;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1rem;
      clip-path: polygon(0 0,100% 0,100% calc(100% - var(--zig-size)),95% 100%,90% calc(100% - var(--zig-size)),85% 100%,80% calc(100% - var(--zig-size)),75% 100%,70% calc(100% - var(--zig-size)),65% 100%,60% calc(100% - var(--zig-size)),55% 100%,50% calc(100% - var(--zig-size)),45% 100%,40% calc(100% - var(--zig-size)),35% 100%,30% calc(100% - var(--zig-size)),25% 100%,20% calc(100% - var(--zig-size)),15% 100%,10% calc(100% - var(--zig-size)),5% 100%,0 calc(100% - var(--zig-size)));
    }
    .main-yellow {
      background: var(--text-color);
      width: 100vw;
      height: 100vh;
      clip-path: polygon(0 var(--zig-size),5% 0,10% var(--zig-size),15% 0,20% var(--zig-size),25% 0,30% var(--zig-size),35% 0,40% var(--zig-size),45% 0,50% var(--zig-size),55% 0,60% var(--zig-size),65% 0,70% var(--zig-size),75% 0,80% var(--zig-size),85% 0,90% var(--zig-size),95% 0,100% var(--zig-size),100% 100%,0 100%);
    }
    .main-purple { background: purple; width: 100vw; height: 100vh; }
    .pink-block { background: pink; width: 100vw; height: 33vh; }
    .footer { background: var(--border-color); width: 100vw; height: var(--header-height); }

    /* Float animations */
    @keyframes float-left { from{transform:translate(-50%,-50%);} to{transform:translate(calc(-50% + var(--float-distance)),-50%);} }
    @keyframes float-right{ from{transform:translate(-50%,-50%);} to{transform:translate(calc(-50% - var(--float-distance)),-50%);} }
    @keyframes float-up   { from{transform:translate(-50%,-50%);} to{transform:translate(-50%,calc(-50% + var(--float-distance)));} }
    @keyframes float-down { from{transform:translate(-50%,-50%);} to{transform:translate(-50%,calc(-50% - var(--float-distance)));} }
    .float-left { animation: float-left var(--slide-interval) linear forwards; }
    .float-right{ animation: float-right var(--slide-interval) linear forwards; }
    .float-up   { animation: float-up var(--slide-interval) linear forwards; }
    .float-down { animation: float-down var(--slide-interval) linear forwards; }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="left-group">
      <a href="https://www.auxdescales17.fr">Aux Dés Calés 17</a>
      <a href="https://www.auxdescales18.fr">Aux Dés Calés 18</a>
      <a href="https://www.audetour18.fr">Au Détour</a>
    </nav>
    <div class="logo-container">
      <img src="/static/logo.png" alt="Logo" class="logo" id="logo-btn">
    </div>
    <nav class="right-group">
      <a href="#yellow">Nos Restos</a>
      <a href="#purple">Nous</a>
      <a href="#pink">Privatiser?</a>
    </nav>
  </header>

  <div class="splitscreen">
    <div class="split" id="split-left"></div>
    <div class="split" id="split-right"></div>
  </div>

  <div class="red-rect">
    Il faudra remplir ici avec un texte qui décrit l'unité des trois restaurants à la fois au niveau de sa carte mais aussi de son ambiance.
  </div>
  <div class="main-yellow" id="yellow"></div>
  <div class="red-rect"></div>
  <div class="main-purple" id="purple"></div>
  <div class="pink-block" id="pink"></div>
  <div class="footer"></div>

  <script>
    // Smooth scroll
    document.addEventListener('DOMContentLoaded', () => {
      const duration = 2000;
      function ease(t) { return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
      function scrollToY(targetY) {
        const startY=window.pageYOffset, diff=targetY-startY; let t0;
        function step(ts){ if(!t0)t0=ts; const t=Math.min((ts-t0)/duration,1);
          window.scrollTo(0,startY+diff*ease(t)); if(t<1)requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
      document.querySelectorAll('.topbar a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{
        e.preventDefault(); const sel=a.getAttribute('href'), el=document.querySelector(sel);
        const y=el?el.getBoundingClientRect().top+window.pageYOffset-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-height')):0;
        scrollToY(y);
      }));
      document.getElementById('logo-btn').addEventListener('click',e=>{e.preventDefault();scrollToY(0);});
    });

    // Slideshow
    document.addEventListener('DOMContentLoaded', () => {
      async function fetchImageList(){
        try{const res=await fetch('/static/header_img/');const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');
          return Array.from(doc.querySelectorAll('a')).map(a=>a.getAttribute('href')).filter(h=>/\.(jpe?g|png)$/i.test(h));
        }catch{return[];}
      }
      function preload(imgs){return Promise.all(imgs.map(s=>new Promise(r=>{const i=new Image();i.src=`/static/header_img/${s}`;i.onload=i.onerror=r;})));}
      fetchImageList().then(imgs=>{if(!imgs.length)return;preload(imgs).then(()=>{
        const patterns={left:['up','left','down','right'],right:['right','down','left','up']};
        const floatMap={left:'float-left',right:'float-right',up:'float-up',down:'float-down'};
        const state={
          left:{idx:0,step:0,cur:null,el:document.getElementById('split-left')},
          right:{idx:1,step:0,cur:null,el:document.getElementById('split-right')}
        };
        function create(src){const d=document.createElement('div');d.className='slide';d.style.backgroundImage=`url(/static/header_img/${src})`;return d;}
        // offset helpers for pan transitions (full-screen)
        function offs(dir){return{left:[-100,0],right:[100,0],up:[0,-100],down:[0,100]}[dir];}
        function adv(side){
          const s=state[side], pat=patterns[side];
          const dir=pat[(++s.step-1)%pat.length];
          s.idx=(s.idx+1)%imgs.length;
          const old=s.cur;
          const next=create(imgs[s.idx]);
          const [ox,oy]=offs(dir);
          next.style.transform=`translate(calc(-50% + ${ox}% ),calc(-50% + ${oy}% ))`;
          s.el.append(next);
          requestAnimationFrame(()=>{
            const start=getComputedStyle(old).transform;
            old.classList.remove(...Object.values(floatMap));
            old.style.transform=start;
            void old.offsetWidth;
            old.style.transform=`translate(calc(-50% - ${ox}% ),calc(-50% - ${oy}% ))`;
            next.style.transform='translate(-50%,-50%)';
          });
          old.addEventListener('transitionend',()=>{s.el.removeChild(old);next.classList.add(floatMap[dir]);},{once:true});
          s.cur=next;
        }
        ['left','right'].forEach(side=>{const s=state[side];s.cur=create(imgs[s.idx]);s.el.append(s.cur);s.cur.classList.add(floatMap[patterns[side][0]]);
          setInterval(()=>adv(side),parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slide-interval')));
        });
      });});
    });
  </script>
</body>
</html>
