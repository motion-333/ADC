<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aux Dés Calés Slideshow</title>
  <link rel="preload" as="image" href="/static/header_img/header1.jpg">
  <link rel="preload" as="image" href="/static/header_img/header2.jpg">
  <link rel="preload" as="image" href="/static/header_img/header3.jpg">
  <link rel="preload" as="image" href="/static/header_img/header4.jpg">
  <link rel="preload" as="image" href="/static/header_img/header5.jpg">
  <link rel="preload" as="image" href="/static/header_img/header6.jpg">
  <link rel="preload" as="image" href="/static/header_img/header7.jpg">
  <link rel="preload" as="image" href="/static/header_img/header8.jpg">
  <link rel="preload" as="image" href="/static/header_img/header9.jpg">
  <link rel="preload" as="image" href="/static/header_img/header10.jpg">
  <link rel="preload" as="image" href="/static/header_img/header11.jpg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Futura:wght@700&display=swap');
    :root {
      --header-height: 10vh;
      --scroll-duration: 2000ms;
      --slide-duration: 1000ms;
      --slide-interval: 2000ms;
      --border-color: #b20000;
      --text-color: #f1ede2;
      --slide-scale: 105%;
      --float-distance: 3%;
      --top-offset: 0;
      --top-padding: 6px;
      --padding1: 30px;
      --spacing1: 1.5rem;
      --spacing2: 2rem;
      --topbar-color-light: #163359;
      --topbar-color-dark: #f1ede2;
      --topbar-text: var(--topbar-color-dark);
      --zig-size: 20px;
      --blur-extra: 9rem;
      --zig-step: 2%;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Futura', sans-serif; }

    /* Topbar */
    .topbar {
      position: fixed;
      top: calc(env(safe-area-inset-top) + var(--top-offset));
      left: 0;
      width: 100vw;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--top-padding) var(--padding1) 0;
      z-index: 1000;
    }
    .topbar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + var(--blur-extra));
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0) 90%);
      z-index: 0;
    }
    .topbar > * { position: relative; z-index: 1; }
    .left-group,
    .right-group {
      display: flex;
      align-items: center;
      flex: 1;
    }
    .left-group {
      gap: var(--spacing1);
      justify-content: flex-start;
    }
    .right-group {
      gap: var(--spacing1);
      justify-content: flex-end;
    }
    .logo-container {
      margin: 0 var(--spacing2);
      display: flex;
      align-items: center;
    }
    .topbar a {
      color: var(--topbar-text);
      text-transform: uppercase;
      font-weight: bold;
      font-size: 1.1rem;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.5s;
    }
    .logo {
      height: 60%;
      max-height: var(--header-height);
      cursor: pointer;
    }

    /* Slideshow iframe */
    .slideshow-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }

    /* Blocks */
    .red-rect {
      background: var(--border-color);
      color: var(--text-color);
      width: 100vw;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1rem;
      clip-path: polygon(0 0,100% 0,100% calc(100% - var(--zig-size)),98% 100%,96% calc(100% - var(--zig-size)),94% 100%,92% calc(100% - var(--zig-size)),90% 100%,88% calc(100% - var(--zig-size)),86% 100%,84% calc(100% - var(--zig-size)),82% 100%,80% calc(100% - var(--zig-size)),78% 100%,76% calc(100% - var(--zig-size)),74% 100%,72% calc(100% - var(--zig-size)),70% 100%,68% calc(100% - var(--zig-size)),66% 100%,64% calc(100% - var(--zig-size)),62% 100%,60% calc(100% - var(--zig-size)),58% 100%,56% calc(100% - var(--zig-size)),54% 100%,52% calc(100% - var(--zig-size)),50% 100%,48% calc(100% - var(--zig-size)),46% 100%,44% calc(100% - var(--zig-size)),42% 100%,40% calc(100% - var(--zig-size)),38% 100%,36% calc(100% - var(--zig-size)),34% 100%,32% calc(100% - var(--zig-size)),30% 100%,28% calc(100% - var(--zig-size)),26% 100%,24% calc(100% - var(--zig-size)),22% 100%,20% calc(100% - var(--zig-size)),18% 100%,16% calc(100% - var(--zig-size)),14% 100%,12% calc(100% - var(--zig-size)),10% 100%,8% calc(100% - var(--zig-size)),6% 100%,4% calc(100% - var(--zig-size)),2% 100%,0% calc(100% - var(--zig-size)),0 0);
    }
    .red-box {
      background: var(--border-color);
      width: 100vw;
      height: 200px;
    }
    .main-yellow {
      background: var(--text-color);
      width: 100vw;
      height: 100vh;
      clip-path: polygon(0 0,2% var(--zig-size),4% 0,6% var(--zig-size),8% 0,10% var(--zig-size),12% 0,14% var(--zig-size),16% 0,18% var(--zig-size),20% 0,22% var(--zig-size),24% 0,26% var(--zig-size),28% 0,30% var(--zig-size),32% 0,34% var(--zig-size),36% 0,38% var(--zig-size),40% 0,42% var(--zig-size),44% 0,46% var(--zig-size),48% 0,50% var(--zig-size),52% 0,54% var(--zig-size),56% 0,58% var(--zig-size),60% 0,62% var(--zig-size),64% 0,66% var(--zig-size),68% 0,70% var(--zig-size),72% 0,74% var(--zig-size),76% 0,78% var(--zig-size),80% 0,82% var(--zig-size),84% 0,86% var(--zig-size),88% 0,90% var(--zig-size),92% 0,94% var(--zig-size),96% 0,98% var(--zig-size),100% 0,100% 100%,0 100%);
      margin-top: calc(-1 * var(--zig-size));
    }
    .main-purple { background: purple; width: 100vw; height: 100vh; }
    .pink-block {
      background: pink;
      width: 100vw;
      height: 100vh;
    }
    .footer {
      background: var(--border-color);
      width: 100vw;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--padding1);
      color: var(--text-color);
      font-size: 0.8rem;
    }
    .footer-right {
      display: flex;
      align-items: center;
      gap: var(--spacing1);
    }
    #back-top {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    /* Float animations */
    @keyframes float-left { from{transform:translate(-50%,-50%);} to{transform:translate(calc(-50% - var(--float-distance)),-50%);} }
    @keyframes float-right{ from{transform:translate(-50%,-50%);} to{transform:translate(calc(-50% + var(--float-distance)),-50%);} }
    @keyframes float-up   { from{transform:translate(-50%,-50%);} to{transform:translate(-50%,calc(-50% - var(--float-distance)));} }
    @keyframes float-down { from{transform:translate(-50%,-50%);} to{transform:translate(-50%,calc(-50% + var(--float-distance)));} }
    .float-left { animation: float-left var(--slide-interval) ease-out forwards; }
    .float-right{ animation: float-right var(--slide-interval) ease-out forwards; }
    .float-up   { animation: float-up var(--slide-interval) ease-out forwards; }
    .float-down { animation: float-down var(--slide-interval) ease-out forwards; }

    .resto-frame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="left-group">
      <a href="https://www.auxdescales17.fr">Aux Dés Calés 17</a>
      <a href="https://www.auxdescales18.fr">Aux Dés Calés 18</a>
      <a href="https://www.audetour18.fr">Au Détour</a>
    </nav>
    <div class="logo-container">
      <img src="/static/logo.png" alt="Logo" class="logo" id="logo-btn">
    </div>
    <nav class="right-group">
      <a href="#yellow">Nos Restos</a>
      <a href="#purple">Nous</a>
      <a href="#pink">Privatiser?</a>
    </nav>
  </header>

  <iframe src="public/index.html" class="slideshow-frame"></iframe>

  <div class="red-rect" data-bright="dark">
    Il faudra remplir ici avec un texte qui décrit l'unité des trois restaurants à la fois au niveau de sa carte mais aussi de son ambiance.
  </div>
  <div class="main-yellow" id="yellow" data-bright="light">
    <iframe src="resto.html" class="resto-frame"></iframe>
  </div>
  <div class="red-box" data-bright="dark"></div>
  <div class="main-purple" id="purple" data-bright="dark"></div>
  <div class="pink-block" id="pink" data-bright="light"></div>
  <div class="footer">
    <span>©2025 Aux Dés Calés</span>
    <div class="footer-right">
      <button id="back-top">Haut de page</button>
      <span>Dev. by <a href="https://motion333.com" target="_blank">Motion</a></span>
    </div>
  </div>

  <script>
    // Smooth scroll
    document.addEventListener('DOMContentLoaded', () => {
      const defaultDuration = 2000;
      function ease(t) { return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
      function scrollToY(targetY,duration=defaultDuration) {
        const startY=window.pageYOffset, diff=targetY-startY; let t0;
        function step(ts){ if(!t0)t0=ts; const t=Math.min((ts-t0)/duration,1);
          window.scrollTo(0,startY+diff*ease(t)); if(t<1)requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
      const headerEl = document.querySelector('.topbar');
      document.querySelectorAll('.topbar a[href^="#"]').forEach(a => a.addEventListener('click', e => {
        e.preventDefault();
        const sel = a.getAttribute('href');
        const el  = document.querySelector(sel);
        const headerH = headerEl.getBoundingClientRect().height;
        const y = el ? el.getBoundingClientRect().top + window.pageYOffset - headerH : 0;
        scrollToY(y);
      }));
      document.getElementById('logo-btn').addEventListener('click',e=>{e.preventDefault();scrollToY(0);});
      const back=document.getElementById('back-top');
      if(back){back.addEventListener('click',e=>{e.preventDefault();scrollToY(0,3000);});}

      const root = document.documentElement;
      let frameBright = 255;

      function colorFromBrightness(b) {
        const dark  = getComputedStyle(root).getPropertyValue('--topbar-color-dark').trim();
        const light = getComputedStyle(root).getPropertyValue('--topbar-color-light').trim();
        return b > 127 ? light : dark;
      }

      function getColorBrightness(col) {
        const m = col.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (m) {
          return 0.299*+m[1] + 0.587*+m[2] + 0.114*+m[3];
        }
        return 255;
      }

      function elementBrightness(el) {
        if (!el) return 255;
        if (el.dataset.bright) return el.dataset.bright === 'dark' ? 0 : 255;
        const style = getComputedStyle(el);
        if (style.backgroundColor && style.backgroundColor !== 'rgba(0, 0, 0, 0)') {
          return getColorBrightness(style.backgroundColor);
        }
        return elementBrightness(el.parentElement);
      }

      function updateTopbar() {
        const rect = headerEl.getBoundingClientRect();
        const y = rect.bottom + 1;
        const el = document.elementFromPoint(window.innerWidth/2, y);
        let brightness;
        if (el && (el.tagName === 'IFRAME' || el.closest('iframe'))) {
          brightness = frameBright;
        } else {
          brightness = elementBrightness(el);
        }
        root.style.setProperty('--topbar-text', colorFromBrightness(brightness));
      }

      const frame = document.querySelector('.slideshow-frame');

      function checkFrame() {
        const shouldPause = window.pageYOffset >= window.innerHeight;
        frame.contentWindow.postMessage({type: shouldPause ? 'pause' : 'resume'}, '*');
      }

      window.addEventListener('scroll', () => {
        updateTopbar();
        checkFrame();
      });
      window.addEventListener('message', e => {
        if(e.data && e.data.type === 'brightness') {
          frameBright = e.data.value;
          updateTopbar();
        }
      });

      updateTopbar();
      checkFrame();
      // poll regularly so color reacts even without scrolling
      setInterval(updateTopbar, 50);
    });

  </script>

</body>
</html>
