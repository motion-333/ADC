<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* Reset & Font */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Futura', sans-serif;
      background: #f1ede2;
      color: #163359;
      overflow: hidden;
    }

    /* Full screen container */
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      row-gap: 60px;
    }

    /* Wrapper for each line */
    .line-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      height: 200px;
    }

    /* Sidebar with logo and info */
    .sidebar {
      flex: 0 0 155px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: start;
    }
    .rectangle {
      margin-left: 5px;
      width: 155px;
      height: 124px;
      flex-shrink: 0;
      object-fit: cover;
      object-position: center;
    }
    .info {
      margin-top: 8px;
      margin-left: 4px;
      text-align: start;
      font-size: 14px;
      line-height: 1.2;
      color: #163359;
    }
    .info a {
      display: block;
      margin-top: 4px;
      color: #163359;
      text-transform: uppercase;
      font-weight: bold;
      text-decoration: none;
    }

    /* Ticker area */
    .line {
      left: 10px;
      flex: 1;
      height: 200px;
      position: relative;
      overflow: hidden;
      --offset: 0ms;
    }
    .fade {
      position: absolute;
      top: 0;
      left: 0;
      width: 155px;
      height: 200px;
      background: linear-gradient(to right, rgba(241,237,226,1), rgba(241,237,226,0));
      pointer-events: none;
      z-index: 10;
    }
    .scroll-wrapper {
      height: 100%;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .strip { display: flex; will-change: transform; }

    /* image squares */
    .square {
      width: 100px;
      height: 100px;
      margin: 0 40px 0 0;
      flex-shrink: 0;
      transform-origin: center;
      object-fit: cover;
    }
    .label {
      margin: 0 40px 0 0;
      font-size: 36px;
      text-transform: uppercase;
      color: #163359;
      flex-shrink: 0;
      transform-origin: center;
    }

    /* Menu overlay */
    .menu-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(150%, -50%);
      transition: transform 4s ease;
      pointer-events: none;
      z-index: 9999;
    }
    .menu-overlay.active {
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }
    .menu-overlay img {
      height: 75vh;
      animation: none;
    }

    @keyframes rotate-snap {
      0%   { transform: rotate(-15deg); }
      50%  { transform: rotate(15deg);  }
      100% { transform: rotate(-15deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Wrapper 1 -->
    <div class="line-wrapper">
      <div class="sidebar">
        <img class="rectangle" src="/static/img/logo_17.png" alt="Logo 17">
        <div class="info">
          Aux Dés Calés 17<br>
          181 Rue Legendre<br>
          +33 1 47 70 01 09<br>
          <a href="#">Réserver</a>
          <a href="#" class="menu-btn" data-img="/static/menu/17.png">Menu</a>
        </div>
      </div>
      <div class="line" data-offset="0ms">
        <div class="fade"></div>
        <div class="scroll-wrapper">
          <div class="strip"></div>
        </div>
      </div>
    </div>
    <!-- Wrapper 2 -->
    <div class="line-wrapper">
      <div class="sidebar">
        <img class="rectangle" src="/static/img/logo_18.png" alt="Logo 18">
        <div class="info">
          Aux Dés Cales 18<br>
          11 rue Hégésippe Moreau<br>
          +33 1 42 66 95 43<br>
          <a href="#">Réserver</a>
          <a href="#" class="menu-btn" data-img="/static/menu/18.png">Menu</a>
        </div>
      </div>
      <div class="line" data-offset="5000ms">
        <div class="fade"></div>
        <div class="scroll-wrapper">
          <div class="strip"></div>
        </div>
      </div>
    </div>
    <!-- Wrapper 3 -->
    <div class="line-wrapper">
      <div class="sidebar">
        <img class="rectangle" src="/static/img/logo_dt.png" alt="Logo DT">
        <div class="info">
          Au Détour<br>
          15 Rue Ganneron<br>
          +33 01 71 27 50 91<br>
          <a href="#">Réserver</a>
          <a href="#" class="menu-btn" data-img="/static/menu/detour.png">Menu</a>
        </div>
      </div>
      <div class="line" data-offset="10000ms">
        <div class="fade"></div>
        <div class="scroll-wrapper">
          <div class="strip"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="menu-overlay" class="menu-overlay">
    <img src="" alt="menu" />
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const duration = 30000;

      // HEAD-check sequentially numbered PNGs
      async function getImageCount(folder) {
        let count = 0;
        while (true) {
          const url = `${folder}${count+1}.png`;
          try {
            const res = await fetch(url, { method: 'HEAD' });
            if (res.ok) count++;
            else break;
          } catch {
            break;
          }
        }
        return count;
      }

      // fetch counts
      const count17_18 = await getImageCount('/static/plats_17_18/');
      const countDt    = await getImageCount('/static/plats_dt/');

      // rotation toggles
      let evenState = 0;
      let oddState  = 0;
      let labelState = 0;
      setInterval(() => {
        evenState ^= 1;
        document.querySelectorAll('.square.even')
          .forEach(el => el.style.transform = `rotate(${evenState ? 15 : -15}deg)`);
      }, 500);
      setTimeout(() => {
        setInterval(() => {
          oddState ^= 1;
          document.querySelectorAll('.square.odd')
            .forEach(el => el.style.transform = `rotate(${oddState ? 15 : -15}deg)`);
        }, 500);
      }, 500);
      setInterval(() => {
        labelState ^= 1;
        document.querySelectorAll('.menu').forEach(el => el.style.transform = `rotate(${labelState ? 15 : -15}deg)`);
        document.querySelectorAll('.reserver').forEach(el => el.style.transform = `rotate(${labelState ? -15 : 15}deg)`);
      }, 500);

      // build each strip
      document.querySelectorAll('.line').forEach((line, idx) => {
        const offset = parseFloat(line.dataset.offset);
        const strip  = line.querySelector('.strip');

        const isDtLine = idx === 2;
        const folder   = isDtLine ? '/static/plats_dt/' : '/static/plats_17_18/';
        const count    = isDtLine ? countDt    : count17_18;

        // sequential index counter
        let imgIndex = 0;

        for (let copy = 0; copy < 2; copy++) {
          for (let i = 0; i < 12; i++) {
            const isEven = !!(i % 2);

            if (i === 4 || i === 8) {
              const lbl = document.createElement('span');
              lbl.className = 'label ' + (i === 4 ? 'menu' : 'reserver');
              lbl.textContent = (i === 4 ? 'MENU' : 'RÉSERVER');
              strip.appendChild(lbl);
            } else {
              const img = document.createElement('img');
              img.className = 'square ' + (isEven ? 'even' : 'odd');

              // cycle through 1…count
              const n = (imgIndex % count) + 1;
              img.src = `${folder}${n}.png`;
              imgIndex++;

              strip.appendChild(img);
            }
          }
        }

        // scrolling
        const contentWidth = strip.offsetWidth / 2;
        const speed        = contentWidth / duration;
        let start = null;
        function step(ts) {
          if (!start) start = ts;
          const elapsed = ts - start + offset;
          const x = -((elapsed * speed) % contentWidth);
          strip.style.transform = `translateX(${x}px)`;
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });

      // menu overlay logic
      const overlay = document.getElementById('menu-overlay');
      const overlayImg = overlay.querySelector('img');
      let visible = false;

      function showMenu(src) {
        overlayImg.src = src;
        overlayImg.style.animation = 'rotate-snap 1s ease-in-out 4 alternate';
        overlay.classList.add('active');
        overlay.style.transform = 'translate(-50%, -50%)';
        visible = true;
      }

      function hideMenu() {
        overlayImg.style.animation = 'rotate-snap 1s ease-in-out 4 alternate';
        overlay.style.transform = 'translate(150%, -50%)';
        overlay.addEventListener('transitionend', () => {
          if (!visible) overlay.classList.remove('active');
        }, { once: true });
        visible = false;
      }

      document.querySelectorAll('.menu-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          if (visible) {
            hideMenu();
          } else {
            showMenu(btn.dataset.img);
          }
        });
      });
    });
  </script>
</body>
</html>
